name: prism_defense
description: "LIGHT vs SHADOW — Prism Defense. Offline landscape light-optics lane defense built on Flutter + Flame."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.11.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Engine (ADR-001)
  flame: ^1.34.0
  flame_audio: ^2.11.0
  flame_riverpod: ^5.4.0

  # State + routing (ADR-002, ADR-003)
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0

  # Offline persistence (ADR-004)
  hive_ce: ^2.11.0
  hive_ce_flutter: ^2.3.0

  # Monetization (ADR-005) — wired in PH-05, not before
  # google_mobile_ads: ^6.0.0   # DEFERRED 2026-09-04 (PH-05 ads/IAP). google_mobile_ads 6.0.0
  #   breaks Gradle 9.3.1 (configurations.all removed) and blocks the whole
  #   Android build. Restore with lib/core/monetization.dart from git when
  #   monetization resumes; needs a version compatible with Gradle 9.
  # in_app_purchase: ^3.2.0   # DEFERRED 2026-09-04 (PH-05 ads/IAP). google_mobile_ads 6.0.0
  #   breaks Gradle 9.3.1 (configurations.all removed) and blocks the whole
  #   Android build. Restore with lib/core/monetization.dart from git when
  #   monetization resumes; needs a version compatible with Gradle 9.

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  # RULE-UI: no Material widgets are used; uses-material-design only ships the
  # icon font, which this project does not reference. Kept false deliberately.
  uses-material-design: false

  assets:
    - assets/data/
    - assets/levels/
    - assets/audio/
